<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mermaid Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 13px;
            color: #4a9eff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: #445566;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }
        .toggle-btn:hover { background: #0f3460; color: #7dc3ff; }
        .toggle-btn.active { background: #4a9eff; color: #fff; font-weight: bold; }

        .btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #1a5276;
            border-radius: 4px;
            color: #4a9eff;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }
        .btn:hover { background: #1a5276; color: #7dc3ff; }

        .zoom-info {
            margin-left: auto;
            font-size: 11px;
            color: #7a9abb;
            font-family: inherit;
        }

        .editor-container { display: flex; flex: 1; overflow: hidden; }

        #editor {
            flex: 1;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            background: #0d1117;
            color: #c9d1d9;
            outline: none;
            display: none;
        }

        #chart {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }
        #chart.panning { cursor: grabbing; }
        #chart-svg-layer { width: 100%; height: 100%; }

        .hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #e74c3c;
            padding: 16px;
            font-size: 13px;
            background: #1a0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">Mermaid</span>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-chart" onclick="toggleView('chart')">Chart</button>
            <button class="toggle-btn" id="btn-editor" onclick="toggleView('editor')">Editor</button>
        </div>
        <button class="btn" onclick="renderMermaid()">⟳ Render</button>
        <button class="btn" onclick="fitToScreen()">⤢ Fit</button>
        <button class="btn" onclick="resetZoom()">1:1 Reset</button>
        <span class="zoom-info" id="zoom-info">100%</span>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false">--Title-- Sign-Out Flow

sequenceDiagram
  autonumber
  actor User
  participant Browser
  participant D2C as D2C(UIV2) Spotlight UI
  participant BFF as D2C(UIV2) BFF<br/>(SSR server)
  participant OktaSDK as Okta Auth SDK
  participant Okta as Okta IdP
  User->>D2C: Sign out
  D2C->>BFF: Clear session
  BFF->>Browser: Expire HttpOnly session cookies
  D2C->>OktaSDK: End client auth state
  OktaSDK->>Okta: End SSO session (optional)
  Okta-->>Browser: Redirect to public page</textarea>

        <div id="chart">
            <div class="hint">🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom</div>
        </div>
    </div>

    <script>
        // ── Constants ──────────────────────────────────────────────────────────
        const TITLE_OFFSET = 75;   // px gap reserved above the diagram for title
        const TITLE_FONT   = "bold 20px 'Trebuchet MS', Arial, sans-serif";

        // ── D3 zoom setup ──────────────────────────────────────────────────────
        let zoomBehavior = d3.zoom()
            .scaleExtent([0.05, 20])
            .on('zoom', ({ transform }) => {
                if (innerG) innerG.attr('transform', transform);
                document.getElementById('zoom-info').textContent =
                    Math.round(transform.k * 100) + '%';
            });

        const chartDiv = document.getElementById('chart');

        const outerSvg = d3.select(chartDiv)
            .append('svg')
            .attr('id', 'chart-svg-layer')
            .style('position', 'absolute')
            .style('top', 0).style('left', 0)
            .style('width', '100%').style('height', '100%');

        let innerG = outerSvg.append('g').attr('id', 'inner-g');

        outerSvg.call(zoomBehavior).on('dblclick.zoom', null);
        outerSvg.on('mousedown', () => chartDiv.classList.add('panning'))
                 .on('mouseup',   () => chartDiv.classList.remove('panning'));

        let lastW = 0, lastH = 0;

        // ── Title extraction ───────────────────────────────────────────────────
        // Strips the optional "--Title-- My Title" line from the top of the code
        // and returns { title, cleanCode }.
        // Syntax:  --Title-- Whatever text you want
        function extractTitle(raw) {
            const match = raw.match(/^[ \t]*--Title--[ \t]+(.+)$/im);
            if (!match) return { title: null, cleanCode: raw.trim() };
            const title     = match[1].trim();
            const cleanCode = raw.replace(match[0], '').trim();
            return { title, cleanCode };
        }

        // ── Render ─────────────────────────────────────────────────────────────
        async function renderMermaid() {
            const raw = document.getElementById('editor').value;
            innerG.selectAll('*').remove();

            const { title, cleanCode } = extractTitle(raw);

            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                logLevel: 5,
                flowchart: { curve: 'step' }
            });

            try {
                const id = 'mermaid-graph-' + Date.now();
                const { svg } = await mermaid.render(id, cleanCode);

                // Parse via HTML innerHTML so SVG + foreignObject namespaces
                // are both handled correctly (DOMParser xml mode drops HTML
                // namespace inside foreignObjects, making node labels vanish)
                const wrapper = document.createElement('div');
                wrapper.innerHTML = svg;
                const renderedSvg = wrapper.querySelector('svg');

                // Read explicit numeric dimensions Mermaid sets on the root <svg>
                let diagW = parseFloat(renderedSvg.getAttribute('width'));
                let diagH = parseFloat(renderedSvg.getAttribute('height'));

                // viewBox fallback
                if (!diagW || !diagH || isNaN(diagW) || isNaN(diagH)) {
                    const vb = (renderedSvg.getAttribute('viewBox') || '').trim().split(/[\s,]+/);
                    diagW = parseFloat(vb[2]) || 800;
                    diagH = parseFloat(vb[3]) || 600;
                }

                // ── Render title ───────────────────────────────────────────────
                // Drawn at y=48 so it sits 48px from the top of the innerG
                // coordinate space. The diagram is then pushed down TITLE_OFFSET
                // px so they never overlap.
                const yOffset = title ? TITLE_OFFSET : 0;

                if (title) {
                    // Underline bar
                    innerG.append('line')
                        .attr('x1', 0).attr('y1', 56)
                        .attr('x2', diagW).attr('y2', 56)
                        .attr('stroke', '#c0c8d8')
                        .attr('stroke-width', 1.5);

                    // Bold title text
                    innerG.append('text')
                        .attr('x', 0)
                        .attr('y', 42)
                        .attr('font-family', "'Trebuchet MS', Arial, sans-serif")
                        .attr('font-size', '20px')
                        .attr('font-weight', 'bold')
                        .attr('fill', '#1a1a2e')
                        .text(title);
                }

                // ── Embed diagram ──────────────────────────────────────────────
                // foreignObject starts yOffset px below the title
                const fo = innerG.append('foreignObject')
                    .attr('x', 0)
                    .attr('y', yOffset)
                    .attr('width',  diagW)
                    .attr('height', diagH);

                fo.node().appendChild(renderedSvg);

                // Total bounding height includes title gap
                lastW = diagW;
                lastH = diagH + yOffset;

                requestAnimationFrame(() => fitToScreen(lastW, lastH));

            } catch (err) {
                console.error(err);
                const fo = innerG.append('foreignObject')
                    .attr('width', 640).attr('height', 80)
                    .attr('x', 20).attr('y', 20);
                fo.append('xhtml:div')
                    .attr('class', 'error-msg')
                    .text('⚠ ' + err.message);
            }
        }

        // ── Fit to screen ──────────────────────────────────────────────────────
        function fitToScreen(w, h) {
            if (!w || !h) { w = lastW; h = lastH; }
            if (!w || !h) return;

            const vw  = chartDiv.clientWidth;
            const vh  = chartDiv.clientHeight;
            const pad = 48;
            const scale = Math.min((vw - pad * 2) / w, (vh - pad * 2) / h);
            const tx = (vw - w * scale) / 2;
            const ty = (vh - h * scale) / 2;

            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }

        function resetZoom() {
            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(
                    chartDiv.clientWidth  / 2,
                    chartDiv.clientHeight / 2
                ).scale(1)
            );
        }

        // ── Toggle view ────────────────────────────────────────────────────────
        function toggleView(view) {
            const editor = document.getElementById('editor');
            const chart  = document.getElementById('chart');
            if (view === 'editor') {
                editor.style.display = 'block';
                chart.style.display  = 'none';
                document.getElementById('btn-editor').classList.add('active');
                document.getElementById('btn-chart').classList.remove('active');
            } else {
                editor.style.display = 'none';
                chart.style.display  = 'block';
                document.getElementById('btn-chart').classList.add('active');
                document.getElementById('btn-editor').classList.remove('active');
                requestAnimationFrame(() => fitToScreen());
            }
        }

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
</body>
</html>

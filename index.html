<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mermaid Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 13px;
            color: #4a9eff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: #445566;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .toggle-btn:hover { background: #0f3460; color: #7dc3ff; }

        /* ACTIVE = bright fill, white text — unmistakably selected */
        .toggle-btn.active {
            background: #4a9eff;
            color: #fff;
            font-weight: bold;
        }

        .btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #1a5276;
            border-radius: 4px;
            color: #4a9eff;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .btn:hover { background: #1a5276; color: #7dc3ff; }

        .zoom-info {
            margin-left: auto;
            font-size: 11px;
            color: #7a9abb;
            font-family: inherit;
        }

        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            background: #0d1117;
            color: #c9d1d9;
            outline: none;
            display: none;
        }

        #chart {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }

        #chart.panning { cursor: grabbing; }

        #chart-svg-layer { width: 100%; height: 100%; }

        .hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #e74c3c;
            padding: 20px;
            font-size: 13px;
            background: #1a0000;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">Mermaid</span>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-chart" onclick="toggleView('chart')">Chart</button>
            <button class="toggle-btn" id="btn-editor" onclick="toggleView('editor')">Editor</button>
        </div>
        <button class="btn" onclick="renderMermaid()">⟳ Render</button>
        <button class="btn" onclick="fitToScreen()">⤢ Fit</button>
        <button class="btn" onclick="resetZoom()">1:1 Reset</button>
        <span class="zoom-info" id="zoom-info">100%</span>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false">%% Example Flowchart
flowchart TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do something]
    B -->|No| D[Do something else]
    C --> E[End]
    D --> E
        </textarea>

        <div id="chart">
            <div class="hint">🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom</div>
        </div>
    </div>

    <script>
        // ── D3 zoom setup ──────────────────────────────────────────────────────
        let zoomBehavior = d3.zoom()
            .scaleExtent([0.05, 20])
            .on('zoom', ({ transform }) => {
                if (innerG) innerG.attr('transform', transform);
                document.getElementById('zoom-info').textContent =
                    Math.round(transform.k * 100) + '%';
            });

        const chartDiv = document.getElementById('chart');

        const outerSvg = d3.select(chartDiv)
            .append('svg')
            .attr('id', 'chart-svg-layer')
            .style('position', 'absolute')
            .style('top', 0).style('left', 0)
            .style('width', '100%').style('height', '100%');

        let innerG = outerSvg.append('g').attr('id', 'inner-g');

        outerSvg.call(zoomBehavior).on('dblclick.zoom', null);

        outerSvg.on('mousedown', () => chartDiv.classList.add('panning'))
                 .on('mouseup',   () => chartDiv.classList.remove('panning'));

        // ── Render ─────────────────────────────────────────────────────────────
        async function renderMermaid() {
            const code = document.getElementById('editor').value.trim();
            innerG.selectAll('*').remove();

            // 'step' curve = right-angled orthogonal connector lines (no spaghetti)
            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                logLevel: 5,
                flowchart: { curve: 'step' }
            });

            try {
                const id = 'mermaid-graph-' + Date.now();
                const { svg } = await mermaid.render(id, code);

                // Parse returned SVG string
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svg, 'image/svg+xml');
                const renderedSvg = svgDoc.querySelector('svg');

                // ── KEY FIX ────────────────────────────────────────────────────
                // Mermaid's <style> uses selectors like:
                //   #mermaid-graph-xxx .node rect { ... }
                // Those selectors require an ancestor element with that ID.
                // We create a <g id="mermaid-graph-xxx"> inside innerG so the
                // CSS cascade works exactly as Mermaid intends.
                const wrapperG = innerG.append('g').attr('id', id);

                Array.from(renderedSvg.childNodes).forEach(node => {
                    wrapperG.node().appendChild(document.importNode(node, true));
                });

                // Wait one frame for layout, then fit to the real bounding box
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => fitToScreen());
                });

            } catch (err) {
                console.error(err);
                const fo = innerG.append('foreignObject')
                    .attr('width', 600).attr('height', 200)
                    .attr('x', 20).attr('y', 20);
                fo.append('xhtml:div')
                    .attr('class', 'error-msg')
                    .text('⚠ Error: ' + err.message);
            }
        }

        // ── Fit to screen — uses real SVG bbox ─────────────────────────────────
        function fitToScreen() {
            const vw = chartDiv.clientWidth;
            const vh = chartDiv.clientHeight;

            let bb;
            try { bb = innerG.node().getBBox(); } catch(e) { return; }
            if (!bb || bb.width === 0 || bb.height === 0) return;

            const padding = 48;
            const scaleX = (vw - padding * 2) / bb.width;
            const scaleY = (vh - padding * 2) / bb.height;
            const scale  = Math.min(scaleX, scaleY);   // fill width, respect height

            // Account for any nonzero origin offset in the mermaid SVG
            const tx = (vw  - bb.width  * scale) / 2 - bb.x * scale;
            const ty = (vh  - bb.height * scale) / 2 - bb.y * scale;

            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }

        function resetZoom() {
            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(
                    chartDiv.clientWidth  / 2,
                    chartDiv.clientHeight / 2
                ).scale(1)
            );
        }

        // ── Toggle view ────────────────────────────────────────────────────────
        function toggleView(view) {
            const editor = document.getElementById('editor');
            const chart  = document.getElementById('chart');

            if (view === 'editor') {
                editor.style.display = 'block';
                chart.style.display  = 'none';
                document.getElementById('btn-editor').classList.add('active');
                document.getElementById('btn-chart').classList.remove('active');
            } else {
                editor.style.display = 'none';
                chart.style.display  = 'block';
                document.getElementById('btn-chart').classList.add('active');
                document.getElementById('btn-editor').classList.remove('active');
                requestAnimationFrame(fitToScreen);
            }
        }

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
</body>
</html>

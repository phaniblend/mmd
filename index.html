<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mermaid Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 13px;
            color: #4a9eff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: #445566;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .toggle-btn:hover { background: #0f3460; color: #7dc3ff; }

        .toggle-btn.active {
            background: #4a9eff;
            color: #fff;
            font-weight: bold;
        }

        .btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #1a5276;
            border-radius: 4px;
            color: #4a9eff;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .btn:hover { background: #1a5276; color: #7dc3ff; }

        .zoom-info {
            margin-left: auto;
            font-size: 11px;
            color: #7a9abb;
            font-family: inherit;
        }

        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            background: #0d1117;
            color: #c9d1d9;
            outline: none;
            display: none;
        }

        #chart {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }

        #chart.panning { cursor: grabbing; }
        #chart-svg-layer { width: 100%; height: 100%; }

        .hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #e74c3c;
            padding: 16px;
            font-size: 13px;
            background: #1a0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">Mermaid</span>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-chart" onclick="toggleView('chart')">Chart</button>
            <button class="toggle-btn" id="btn-editor" onclick="toggleView('editor')">Editor</button>
        </div>
        <button class="btn" onclick="renderMermaid()">⟳ Render</button>
        <button class="btn" onclick="fitToScreen()">⤢ Fit</button>
        <button class="btn" onclick="resetZoom()">1:1 Reset</button>
        <span class="zoom-info" id="zoom-info">100%</span>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false">%% Example Flowchart
flowchart TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do something]
    B -->|No| D[Do something else]
    C --> E[End]
    D --> E
        </textarea>

        <div id="chart">
            <div class="hint">🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom</div>
        </div>
    </div>

    <script>
        // ── D3 zoom setup ──────────────────────────────────────────────────────
        let zoomBehavior = d3.zoom()
            .scaleExtent([0.05, 20])
            .on('zoom', ({ transform }) => {
                if (innerG) innerG.attr('transform', transform);
                document.getElementById('zoom-info').textContent =
                    Math.round(transform.k * 100) + '%';
            });

        const chartDiv = document.getElementById('chart');

        const outerSvg = d3.select(chartDiv)
            .append('svg')
            .attr('id', 'chart-svg-layer')
            .style('position', 'absolute')
            .style('top', 0).style('left', 0)
            .style('width', '100%').style('height', '100%');

        let innerG = outerSvg.append('g').attr('id', 'inner-g');

        outerSvg.call(zoomBehavior).on('dblclick.zoom', null);
        outerSvg.on('mousedown', () => chartDiv.classList.add('panning'))
                 .on('mouseup',   () => chartDiv.classList.remove('panning'));

        // Last rendered diagram dimensions — used by ⤢ Fit button
        let lastW = 0, lastH = 0;

        // ── Render ─────────────────────────────────────────────────────────────
        async function renderMermaid() {
            const code = document.getElementById('editor').value.trim();
            innerG.selectAll('*').remove();

            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                logLevel: 5,
                flowchart: { curve: 'step' }   // right-angle orthogonal connectors
            });

            try {
                const id = 'mermaid-graph-' + Date.now();
                const { svg } = await mermaid.render(id, code);

                // ── Parse via an HTML div (NOT DOMParser) ─────────────────────
                // Using innerHTML on a real div element makes the browser parse
                // the SVG in "HTML parsing mode" which correctly handles both:
                //   • SVG namespaces for all graphic elements
                //   • HTML namespaces for <foreignObject> content (node labels)
                // DOMParser with image/svg+xml parses foreignObject content as
                // XML, not HTML — foreignObject labels come out as unknown XML
                // nodes that don't render, so node boxes appear empty.
                const wrapper = document.createElement('div');
                wrapper.innerHTML = svg;
                const renderedSvg = wrapper.querySelector('svg');

                // ── Read explicit dimensions Mermaid sets on the root <svg> ───
                // These are always numeric px values (e.g. "2160.5"), never "%"
                let diagW = parseFloat(renderedSvg.getAttribute('width'));
                let diagH = parseFloat(renderedSvg.getAttribute('height'));

                // viewBox fallback for themes that omit width/height attributes
                if (!diagW || !diagH || isNaN(diagW) || isNaN(diagH)) {
                    const vb = (renderedSvg.getAttribute('viewBox') || '').trim().split(/[\s,]+/);
                    diagW = parseFloat(vb[2]) || 800;
                    diagH = parseFloat(vb[3]) || 600;
                }

                lastW = diagW;
                lastH = diagH;

                // ── Embed the complete SVG inside a foreignObject ─────────────
                // appendChild moves renderedSvg (an SVG element) into the
                // foreignObject. This is the ONLY approach that keeps the SVG's
                // internal structure intact — the CSS #id selectors, the defs,
                // the markers, and critically the <foreignObject> node labels
                // all render correctly because the SVG is a self-contained unit.
                const fo = innerG.append('foreignObject')
                    .attr('width',  diagW)
                    .attr('height', diagH);

                fo.node().appendChild(renderedSvg);

                // One rAF so the browser paints before we compute the transform
                requestAnimationFrame(() => fitToScreen(diagW, diagH));

            } catch (err) {
                console.error(err);
                const fo = innerG.append('foreignObject')
                    .attr('width', 640).attr('height', 80)
                    .attr('x', 20).attr('y', 20);
                fo.append('xhtml:div')
                    .attr('class', 'error-msg')
                    .text('⚠ ' + err.message);
            }
        }

        // ── Fit to screen ──────────────────────────────────────────────────────
        function fitToScreen(w, h) {
            // Button calls with no args → reuse stored dimensions
            if (!w || !h) { w = lastW; h = lastH; }
            if (!w || !h) return;

            const vw  = chartDiv.clientWidth;
            const vh  = chartDiv.clientHeight;
            const pad = 48;

            const scale = Math.min(
                (vw - pad * 2) / w,
                (vh - pad * 2) / h
            );

            // Center horizontally and vertically
            const tx = (vw - w * scale) / 2;
            const ty = (vh - h * scale) / 2;

            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }

        function resetZoom() {
            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(
                    chartDiv.clientWidth  / 2,
                    chartDiv.clientHeight / 2
                ).scale(1)
            );
        }

        // ── Toggle view ────────────────────────────────────────────────────────
        function toggleView(view) {
            const editor = document.getElementById('editor');
            const chart  = document.getElementById('chart');

            if (view === 'editor') {
                editor.style.display = 'block';
                chart.style.display  = 'none';
                document.getElementById('btn-editor').classList.add('active');
                document.getElementById('btn-chart').classList.remove('active');
            } else {
                editor.style.display = 'none';
                chart.style.display  = 'block';
                document.getElementById('btn-chart').classList.add('active');
                document.getElementById('btn-editor').classList.remove('active');
                requestAnimationFrame(() => fitToScreen());
            }
        }

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mermaid Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 13px;
            color: #4a9eff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .toggle-btn:hover { background: #0f3460; color: #ccc; }
        .toggle-btn.active { background: #0f3460; color: #4a9eff; font-weight: bold; }

        .btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #1a5276;
            border-radius: 4px;
            color: #4a9eff;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .btn:hover { background: #1a5276; color: #7dc3ff; }

        .zoom-info {
            margin-left: auto;
            font-size: 11px;
            color: #555;
            font-family: inherit;
        }

        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            background: #0d1117;
            color: #c9d1d9;
            outline: none;
            display: none;
        }

        #chart {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }

        #chart.panning { cursor: grabbing; }

        #chart-svg-layer {
            width: 100%;
            height: 100%;
        }

        .hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #e74c3c;
            padding: 20px;
            font-size: 13px;
            background: #1a0000;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">Mermaid</span>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-chart" onclick="toggleView('chart')">Chart</button>
            <button class="toggle-btn" id="btn-editor" onclick="toggleView('editor')">Editor</button>
        </div>
        <button class="btn" onclick="renderMermaid()">⟳ Render</button>
        <button class="btn" onclick="fitToScreen()">⤢ Fit</button>
        <button class="btn" onclick="resetZoom()">1:1 Reset</button>
        <span class="zoom-info" id="zoom-info">100%</span>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false">%% Example Flowchart
flowchart TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do something]
    B -->|No| D[Do something else]
    C --> E[End]
    D --> E
        </textarea>

        <div id="chart">
            <!-- D3 will create an SVG here that covers the whole chart area -->
            <div class="hint">🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom</div>
        </div>
    </div>

    <script>
        // ── D3 zoom setup ──────────────────────────────────────────────────────
        let zoomBehavior = d3.zoom()
            .scaleExtent([0.05, 20])
            .on('zoom', ({ transform }) => {
                if (innerG) innerG.attr('transform', transform);
                document.getElementById('zoom-info').textContent =
                    Math.round(transform.k * 100) + '%';
            });

        // The persistent SVG that lives in #chart
        const chartDiv = document.getElementById('chart');
        const outerSvg = d3.select(chartDiv)
            .append('svg')
            .attr('id', 'chart-svg-layer')
            .style('position', 'absolute')
            .style('top', 0).style('left', 0)
            .style('width', '100%').style('height', '100%');

        // A <g> inside the SVG — we pan/zoom this
        let innerG = outerSvg.append('g').attr('id', 'inner-g');

        // Attach zoom to the outer SVG
        outerSvg.call(zoomBehavior)
            .on('dblclick.zoom', null); // disable double-click zoom

        // Grab cursor while panning
        outerSvg.on('mousedown', () => chartDiv.classList.add('panning'))
                 .on('mouseup',   () => chartDiv.classList.remove('panning'));

        // ── Render ─────────────────────────────────────────────────────────────
        async function renderMermaid() {
            const code = document.getElementById('editor').value.trim();
            innerG.selectAll('*').remove();   // clear previous diagram

            mermaid.initialize({ startOnLoad: false, theme: 'default', logLevel: 5 });

            try {
                // mermaid.render returns { svg, bindFunctions }
                const id = 'mermaid-graph-' + Date.now();
                const { svg } = await mermaid.render(id, code);

                // Inject the full SVG as a foreignObject so Mermaid's
                // internal <style> and <defs> are preserved intact
                const wrapper = document.createElement('div');
                wrapper.innerHTML = svg;
                const renderedSvg = wrapper.querySelector('svg');

                // Grab width/height from the rendered SVG
                const w = parseFloat(renderedSvg.getAttribute('width'))  || 800;
                const h = parseFloat(renderedSvg.getAttribute('height')) || 600;

                // Place the whole SVG inside a foreignObject inside our <g>
                const fo = innerG.append('foreignObject')
                    .attr('width',  w)
                    .attr('height', h);

                fo.node().appendChild(renderedSvg);

                // Fit the diagram to the visible area after render
                fitToScreen(w, h);

            } catch (err) {
                console.error(err);
                innerG.append('foreignObject')
                    .attr('width', 600).attr('height', 200)
                    .attr('x', 20).attr('y', 20)
                    .append('xhtml:div')
                    .attr('class', 'error-msg')
                    .text('⚠ Error: ' + err.message);
            }
        }

        // ── Fit / Reset ────────────────────────────────────────────────────────
        function fitToScreen(diagW, diagH) {
            const vw = chartDiv.clientWidth;
            const vh = chartDiv.clientHeight;

            // If dimensions weren't passed, try to get them from the bounding box
            if (!diagW || !diagH) {
                const bb = innerG.node().getBBox();
                diagW = bb.width  || vw;
                diagH = bb.height || vh;
            }

            const scale = Math.min(vw / (diagW + 40), vh / (diagH + 40), 1);
            const tx = (vw - diagW * scale) / 2;
            const ty = (vh - diagH * scale) / 2;

            outerSvg.call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }

        function resetZoom() {
            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(
                    chartDiv.clientWidth  / 2,
                    chartDiv.clientHeight / 2
                ).scale(1)
            );
        }

        // ── Toggle view ────────────────────────────────────────────────────────
        function toggleView(view) {
            const editor = document.getElementById('editor');
            const chart  = document.getElementById('chart');

            if (view === 'editor') {
                editor.style.display = 'block';
                chart.style.display  = 'none';
                document.getElementById('btn-editor').classList.add('active');
                document.getElementById('btn-chart').classList.remove('active');
            } else {
                editor.style.display = 'none';
                chart.style.display  = 'block';
                document.getElementById('btn-chart').classList.add('active');
                document.getElementById('btn-editor').classList.remove('active');
            }
        }

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
</body>
</html>

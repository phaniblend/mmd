<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mermaid Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .toolbar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            gap: 8px;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 13px;
            color: #4a9eff;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-right: 8px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid #4a9eff;
            border-radius: 4px;
            overflow: hidden;
        }

        .toggle-btn {
            padding: 6px 14px;
            background: transparent;
            border: none;
            color: #445566;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .toggle-btn:hover { background: #0f3460; color: #7dc3ff; }

        .toggle-btn.active {
            background: #4a9eff;
            color: #fff;
            font-weight: bold;
        }

        .btn {
            padding: 6px 14px;
            background: #0f3460;
            border: 1px solid #1a5276;
            border-radius: 4px;
            color: #4a9eff;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .btn:hover { background: #1a5276; color: #7dc3ff; }

        .zoom-info {
            margin-left: auto;
            font-size: 11px;
            color: #7a9abb;
            font-family: inherit;
        }

        .editor-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            border: none;
            resize: none;
            font-family: 'Courier New', monospace;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            background: #0d1117;
            color: #c9d1d9;
            outline: none;
            display: none;
        }

        #chart {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
            cursor: grab;
        }

        #chart.panning { cursor: grabbing; }
        #chart-svg-layer { width: 100%; height: 100%; }

        .hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: #aaa;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .error-msg {
            color: #e74c3c;
            padding: 20px;
            font-size: 13px;
            background: #1a0000;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">Mermaid</span>
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-chart" onclick="toggleView('chart')">Chart</button>
            <button class="toggle-btn" id="btn-editor" onclick="toggleView('editor')">Editor</button>
        </div>
        <button class="btn" onclick="renderMermaid()">⟳ Render</button>
        <button class="btn" onclick="fitToScreen()">⤢ Fit</button>
        <button class="btn" onclick="resetZoom()">1:1 Reset</button>
        <span class="zoom-info" id="zoom-info">100%</span>
    </div>

    <div class="editor-container">
        <textarea id="editor" spellcheck="false">%% Example Flowchart
flowchart TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do something]
    B -->|No| D[Do something else]
    C --> E[End]
    D --> E
        </textarea>

        <div id="chart">
            <div class="hint">🖱 Drag to pan &nbsp;·&nbsp; Scroll to zoom</div>
        </div>
    </div>

    <script>
        // ── D3 zoom setup ──────────────────────────────────────────────────────
        let zoomBehavior = d3.zoom()
            .scaleExtent([0.05, 20])
            .on('zoom', ({ transform }) => {
                if (innerG) innerG.attr('transform', transform);
                document.getElementById('zoom-info').textContent =
                    Math.round(transform.k * 100) + '%';
            });

        const chartDiv = document.getElementById('chart');

        const outerSvg = d3.select(chartDiv)
            .append('svg')
            .attr('id', 'chart-svg-layer')
            .style('position', 'absolute')
            .style('top', 0).style('left', 0)
            .style('width', '100%').style('height', '100%');

        let innerG = outerSvg.append('g').attr('id', 'inner-g');

        outerSvg.call(zoomBehavior).on('dblclick.zoom', null);

        outerSvg.on('mousedown', () => chartDiv.classList.add('panning'))
                 .on('mouseup',   () => chartDiv.classList.remove('panning'));

        // Tracks last known diagram dimensions for fitToScreen
        let lastDiagW = 0, lastDiagH = 0;

        // ── Render ─────────────────────────────────────────────────────────────
        async function renderMermaid() {
            const code = document.getElementById('editor').value.trim();
            innerG.selectAll('*').remove();

            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                logLevel: 5,
                flowchart: { curve: 'step' }   // orthogonal right-angle connectors
            });

            try {
                const id = 'mermaid-graph-' + Date.now();
                const { svg } = await mermaid.render(id, code);

                // ── Parse the SVG string to extract its real dimensions ────────
                // Mermaid always sets explicit width/height or viewBox on the root
                // <svg>. We read those here — BEFORE embedding — so fitToScreen
                // has accurate numbers without needing getBBox() (which silently
                // returns 0 for foreignObject content).
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svg, 'image/svg+xml');
                const renderedSvg = svgDoc.querySelector('svg');

                let diagW = parseFloat(renderedSvg.getAttribute('width'));
                let diagH = parseFloat(renderedSvg.getAttribute('height'));

                // Fall back to viewBox if width/height are missing or % strings
                if (!diagW || !diagH || isNaN(diagW) || isNaN(diagH)) {
                    const vb = renderedSvg.getAttribute('viewBox');
                    if (vb) {
                        const parts = vb.trim().split(/[\s,]+/);
                        diagW = parseFloat(parts[2]);
                        diagH = parseFloat(parts[3]);
                    }
                }

                // Last resort defaults
                diagW = diagW || 800;
                diagH = diagH || 600;

                // Store for re-use by the ⤢ Fit button
                lastDiagW = diagW;
                lastDiagH = diagH;

                // ── Embed the complete SVG inside a foreignObject ──────────────
                // This is the only approach that correctly renders Mermaid's
                // <foreignObject> node labels (HTML inside SVG). Transplanting
                // child nodes loses the HTML namespace and labels go blank.
                const fo = innerG.append('foreignObject')
                    .attr('width',  diagW)
                    .attr('height', diagH);

                // Use xhtml: namespace so the div is treated as HTML, not XML
                const container = fo.append('xhtml:div')
                    .style('width',  diagW + 'px')
                    .style('height', diagH + 'px')
                    .style('overflow', 'hidden');

                container.node().innerHTML = svg;

                // Give the browser one frame to paint, then fit
                requestAnimationFrame(() => fitToScreen(diagW, diagH));

            } catch (err) {
                console.error(err);
                const fo = innerG.append('foreignObject')
                    .attr('width', 640).attr('height', 120)
                    .attr('x', 20).attr('y', 20);
                fo.append('xhtml:div')
                    .attr('class', 'error-msg')
                    .text('⚠ ' + err.message);
            }
        }

        // ── Fit to screen ──────────────────────────────────────────────────────
        // Uses explicit diagram dimensions (not getBBox which is 0 for foreignObject).
        function fitToScreen(diagW, diagH) {
            // If called from button, reuse last known dimensions
            if (!diagW || !diagH) {
                diagW = lastDiagW;
                diagH = lastDiagH;
            }
            if (!diagW || !diagH) return;

            const vw = chartDiv.clientWidth;
            const vh = chartDiv.clientHeight;
            const padding = 48;

            const scale = Math.min(
                (vw - padding * 2) / diagW,
                (vh - padding * 2) / diagH
            );

            const tx = (vw - diagW * scale) / 2;
            const ty = (vh - diagH * scale) / 2;

            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(tx, ty).scale(scale)
            );
        }

        function resetZoom() {
            outerSvg.transition().duration(300).call(
                zoomBehavior.transform,
                d3.zoomIdentity.translate(
                    chartDiv.clientWidth  / 2,
                    chartDiv.clientHeight / 2
                ).scale(1)
            );
        }

        // ── Toggle view ────────────────────────────────────────────────────────
        function toggleView(view) {
            const editor = document.getElementById('editor');
            const chart  = document.getElementById('chart');

            if (view === 'editor') {
                editor.style.display = 'block';
                chart.style.display  = 'none';
                document.getElementById('btn-editor').classList.add('active');
                document.getElementById('btn-chart').classList.remove('active');
            } else {
                editor.style.display = 'none';
                chart.style.display  = 'block';
                document.getElementById('btn-chart').classList.add('active');
                document.getElementById('btn-editor').classList.remove('active');
                requestAnimationFrame(() => fitToScreen());
            }
        }

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', renderMermaid);
    </script>
</body>
</html>
